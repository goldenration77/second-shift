name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish (example: v1.2.3)"
        required: false
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl wget file \
            pkg-config

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build App
        shell: bash
        run: |
          pake "https://goldenration77.github.io/second-shift/index.html" --name "Second-Shift-Prologue" --width 1600 --height 900 --icon "https://goldenration77.github.io/second-shift/apple-touch-icon.png"

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release-assets

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            find . -type f \( -name '*.msi' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            find . -type f -name '*.dmg' -exec cp {} release-assets/ \;
            while IFS= read -r -d '' app; do
              ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/$(basename "$app").zip"
            done < <(find . -type d -name '*.app' -print0)
          else
            find . -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release-assets/ \;
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Second-Shift-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  release:
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.release_tag != '' &&
        startsWith(github.event.inputs.release_tag, 'v')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Set release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          pattern: Second-Shift-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: Second Shift ${{ steps.release_tag.outputs.value }}
          generate_release_notes: true
          files: release-assets/*
