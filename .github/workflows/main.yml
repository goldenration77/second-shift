name: Build Desktop App

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-24.04
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl wget file \
            pkg-config

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build App
        shell: bash
        run: |
          pake "https://goldenration77.github.io/second-shift/Second_Shift.html" --name "Second-Shift-Prologue" --width 1600 --height 900

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Second-Shift-${{ matrix.name }}
          path: |
            **/*.msi
            **/*.dmg
            **/*.app
            **/*.deb
            **/*.AppImage
            **/*.exe
          if-no-files-found: warn
          retention-days: 5
