name: Build Desktop App with Pake

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-24.04
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build App
        run: |
          pake ./Second_Shift.html \
            --name "Second Shift Prologue" \
            --width 1600 \
            --height 900

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Second-Shift-${{ matrix.name }}
          path: |
            **/*.msi
            **/*.dmg
            **/*.app
            **/*.deb
            **/*.AppImage
            **/*.exe
          retention-days: 7
          if-no-files-found: warn
